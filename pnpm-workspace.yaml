packages:
  - 'examples/*'
allowBuilds:
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@thepia/flows-auth@1.0.14'
# Security overrides (patch-level, same-major → no API risk).
# Runtime path of the published library:
overrides:
  ws@>=8.0.0 <8.21.0: '>=8.21.0' # DoS — via @supabase/supabase-js > realtime-js
  tmp@<0.2.6: '>=0.2.6' # path traversal — via inquirer > external-editor
  # Dev/build tooling only (not shipped):
  minimatch@<3.1.4: '3.1.4'
  minimatch@>=9.0.0 <9.0.7: '9.0.7'
  brace-expansion@<1.1.13: '1.1.13'
  brace-expansion@>=2.0.0 <2.0.3: '2.0.3'
  picomatch@<2.3.2: '2.3.2'
