name: dependencies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flows-client
        uses: actions/checkout@v4
        with:
          path: flows-client

      # @thepia/flows-auth is consumed via `file:../flows-auth` (types only),
      # so the sibling repo must exist next to flows-client for install to work.
      # NODE_AUTH_TOKEN must be a PAT with `repo` (contents:read) scope so it
      # can check out the private thepia/flows-auth repo.
      - name: Checkout flows-auth (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: thepia/flows-auth
          token: ${{ secrets.NODE_AUTH_TOKEN }}
          path: flows-auth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: flows-client/pnpm-lock.yaml

      - name: Install
        working-directory: flows-client
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        working-directory: flows-client
        run: pnpm check

      - name: Typecheck
        working-directory: flows-client
        run: pnpm typecheck

      - name: Test
        working-directory: flows-client
        run: pnpm test

      - name: Build
        working-directory: flows-client
        run: pnpm build
