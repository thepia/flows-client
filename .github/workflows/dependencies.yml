name: dependencies

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.11.0'

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@thepia'

      # @thepia/flows-auth is a devDependency resolved from GitHub Packages
      # (types only, see package.json `comments`). GITHUB_TOKEN is scoped to
      # this repo — if install fails with 404/403 pulling flows-auth, the org
      # doesn't allow cross-repo package reads via GITHUB_TOKEN; swap this for
      # a PAT in the NODE_AUTH_TOKEN repo secret (read:packages scope), same
      # as thepia.com/.github/workflows/deploy-auth-api.yml.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ephemeral, auto-expires

      - name: Lint (biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      # Build BEFORE tests: service-worker-bundle.test.ts and
      # service-worker-execution.test.ts load dist/flows-sw.js, the built
      # bundle, not source files. Running tests first fails with ENOENT.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
