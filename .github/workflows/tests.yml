name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.11.0'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6
      with:
        version: ${{ env.PNPM_VERSION }}

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'

    # Workspace root install: examples/flows-admin-demo has no lockfile of its
    # own, it's resolved through the root pnpm-lock.yaml.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      working-directory: examples/flows-admin-demo
      run: pnpm exec playwright install --with-deps

    - name: Run Playwright tests
      working-directory: examples/flows-admin-demo
      run: pnpm run test

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: examples/flows-admin-demo/playwright-report/
        retention-days: 30
